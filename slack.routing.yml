slack.admin_home:
  path: '/admin/config/services/slack'
  defaults:
    _title: 'Slack'
    _description: 'Slack API integration.'
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
  requirements:
    _permission: 'administer site configuration'

slack.admin_webhook:
  path: '/admin/config/services/slack/webhook'
  defaults:
    _title: 'Slack - Webhook configuration'
    _description: 'Adjust Slack webhook settings.'
    _form: '\Drupal\slack\Form\WebhooksForm'
  requirements:
    _permission: 'administer site configuration'

slack.admin_check:
  path: '/admin/config/services/slack/test/request'
  defaults:
    _title: "Slack - Send a test request"
    _description: 'Allows to send a requests to the Slack.'
    _form: '\Drupal\slack\Form\SendTestRequestForm'
  requirements:
    _permission: 'administer site configuration'
