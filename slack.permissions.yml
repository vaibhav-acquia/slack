add slack app entities:
  title: 'Create new Slack App entities'

administer slack app entities:
  title: 'Administer Slack App entities'
  description: 'Allow to access the administration form to configure Slack App entities.'
  restrict access: true

delete slack app entities:
  title: 'Delete Slack App entities'

edit slack app entities:
  title: 'Edit Slack App entities'

view published slack app entities:
  title: 'View published Slack App entities'

view unpublished slack app entities:
  title: 'View unpublished Slack App entities'

view all slack app revisions:
  title: 'View all Slack App revisions'

revert all slack app revisions:
  title: 'Revert all Slack App revisions'
  description: 'Role requires permission <em>view Slack App revisions</em> and <em>edit rights</em> for slack app entities in question or <em>administer slack app entities</em>.'

delete all slack app revisions:
  title: 'Delete all revisions'
  description: 'Role requires permission to <em>view Slack App revisions</em> and <em>delete rights</em> for slack app entities in question or <em>administer slack app entities</em>.'

